[project]
name = "ai-learning-helper"
version = "0.1.0"
description = "AI 学习助手：基于 ai-harness-framework 内核构建的学习/练习/知识管理应用"
requires-python = ">=3.11"
dependencies = [
    # Agent 运行时内核：模型接入 / 工具循环 / 预算 / 可观测 / 持久化 / 记忆 / 编排 / 沙箱。
    # 已抽成独立可发布包（https://github.com/sumengnan/ai-harness-framework），import 名仍是 harness。
    # [all] 拉齐全部 extras（docker/sqlite-vec/mcp/tree-sitter/tiktoken/trafilatura 等），
    # 覆盖本应用用到的每一路能力——完整消费者本就该装全，见框架 pyproject 注释。
    "ai-harness-framework[all]>=0.0.1",
    # ↓ app 层独有依赖（不属于内核）：Web 服务 + 文档解析 + 表单/文件上传
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# harness 现在是已安装的外部包（ai-harness-framework），不再走 src/ 源码路径；
# 只保留 "." 让 app/ 等顶层包可导入。
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 本仓库现在是应用，不再分发 harness 内核；打包目标为 app/。
packages = ["app"]
