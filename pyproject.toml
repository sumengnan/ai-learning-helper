[project]
name = "harness"
version = "0.1.0"
description = "最小 Agent 运行时内核"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "tiktoken>=0.7",
    "sqlite-vec>=0.1.6",
    "docker[ssh]>=7.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "trafilatura>=1.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "mcp>=1.12.4,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
