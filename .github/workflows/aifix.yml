# 一个 `/aifix` 开头的 issue（或一条 `/aifix` 评论）→ 一个 PR。
#
# aifix 是测试失败驱动的自我修复循环：读 issue 写一条复现测试 → 确认它真的红了 →
# 让模型去修 → **用全量测试判定改得对不对** → 推一条 aifix/<run_id> 分支并开 PR。
# 判卷的是零 LLM 的确定性代码，模型碰不到 tests/ 下的任何文件。
# 上游文档：https://github.com/sumengnan/aifix-code/tree/main/docs
# 本仓库的配置与验收：docs/aifix.md
#
# ⚠️ **这个文件必须待在默认分支（本仓库是 `dev`）上**：GitHub 只从默认分支加载
# issues / issue_comment 的 workflow。放在特性分支上是调不通的 —— 而且不报错，
# 只是永远不触发。
name: aifix

on:
  # 正文第一行是 /aifix 的新 issue —— 主入口，开 issue 即触发。
  #
  # 只认 opened，不接 edited：改自己的 issue 正文是完全静默的（没有新通知，时间线上
  # 只有一个不起眼的标记）。接了 edited，一条半年前的 issue 被改成 /aifix 开头就能
  # 触发，而没有任何人会知道。
  issues:
    types: [opened]
  # 第一行是 /aifix 的评论 —— 用来再跑一次，以及回答 `/aifix <编号>`。
  issue_comment:
    types: [created]

# 同一个 issue 同时只跑一个。手滑连点两次 = 两倍开销，而且两个 run 会抢同一个
# worktree 路径。两种事件的 issue.number 都在同一个位置，一条就够。
concurrency:
  group: aifix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    # 便宜的前置过滤：绝大多数 issue / 评论在这里就被挡掉，一秒 runner 都不花。
    # 权威判定在 aifix 自己的 authorize() 里（还要挡 PR、bot、命令不在第一行、以及
    # 全部权限判定）。两处都要，不是重复 —— 这里挡不住的由代码挡。
    #
    # **这里刻意不判权限**，尽管加一条 author_association 会更省 runner 分钟数。
    # 理由：没权限的人打了 /aifix，要求是**回帖告诉他**（静默丢弃会让他以为已经在跑
    # 了）。而 job 的 if: 拦下来的事件根本不会起 job，也就没有任何东西能发出那条回帖。
    #
    # 代价说清楚：任何人开一个 /aifix 开头的 issue 都会起一次 job（约 1~2 分钟 runner，
    # 零模型调用，随即以一条权限说明收场）。本仓库是公开仓库，这是一个可被刷的面 ——
    # 真被刷了，就把权限判据加回这个 if:，代价是那些人不再收到解释。
    if: >
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.body, '/aifix')) ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/aifix'))

    runs-on: ubuntu-latest
    # 必须显著大于 AIFIX_BUDGET_WALL_SECONDS。Actions 的超时是**杀进程**：aifix 里那个
    # 「保证报告先落地」的分支根本执行不到，跑了一小时什么都留不下。让 aifix 自己的
    # 墙钟闸先响（60 分钟），硬杀（90 分钟）只是兜底。
    timeout-minutes: 90

    # 显式写全。不写的话仓库默认可能是宽松的，而「我以为它是最小权限」是这类事故最
    # 常见的开头。
    permissions:
      contents: write          # 推交付分支与 aifix/traces
      issues: write            # 状态评论、reaction
      pull-requests: write     # 开 PR

    steps:
      - uses: actions/checkout@v5
        with:
          # 要完整历史：交付分支是从 HEAD 长出来的新分支，从浅克隆推新分支在部分场景
          # 下会被拒（shallow update not allowed）。这个仓库不大，换几秒 checkout 买掉
          # 一整类只在生产出现的失败。
          fetch-depth: 0

      # ┌─────────────────────────────────────────────────────────────┐
      # │ 本项目自己的测试环境。与 ci.yml 的 python job 保持同一套装法。 │
      # │ 唯一要求：装完之后 .venv/bin/python 能跑起 pytest。            │
      # └─────────────────────────────────────────────────────────────┘
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --frozen 不是可选的：不带它 uv sync 会重写 uv.lock，把工作区弄脏，而 aifix 的
      # preflight 见到脏工作区直接拒绝启动（baseline 是从 HEAD 算的，工作区另有改动时
      # 算出来的失败集合和你眼前看到的对不上）。
      - name: 安装依赖（按 uv.lock 复现）
        run: uv sync --frozen

      # ┌─────────────────────────────────────────────────────────────┐
      # │ 前端的测试环境。aifix 0.2.0 起一次 run 可以两套测试都跑，而      │
      # │ vitest 那套要有 web/node_modules —— worktree 只含被 git 跟踪的  │
      # │ 文件，aifix 会从**源仓库**这一份借过去（逐个子项软链）。         │
      # │ 不装的话 baseline 会去跑一个不存在的二进制，而报错读起来像       │
      # │ 「测试进程没能正常跑完」，指不到点子上。                         │
      # └─────────────────────────────────────────────────────────────┘
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖（按 lock 复现）
        run: npm ci --prefix web

      # 装依赖有时仍会改动被跟踪的文件。真发生了就还原，别让 preflight 在后面才拒绝。
      - name: 确认工作区干净
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::warning::安装步骤改动了被跟踪的文件，已还原："
            git status --porcelain --untracked-files=no
            git checkout -- .
          fi

      # ┌─────────────────────────────────────────────────────────────┐
      # │ aifix 装在**独立** venv 里，不碰本项目的测试环境。             │
      # │ 它自己依赖 langgraph / pydantic / openai —— 混进 .venv 轻则版本 │
      # │ 冲突，重则污染跑 baseline 的那套环境，凭空多出一批红。          │
      # └─────────────────────────────────────────────────────────────┘
      - name: 装 aifix
        run: |
          python3 -m venv /tmp/aifix-venv
          # 发行名是 aifix-code，装完命令叫 aifix。
          # **钉住版本**：不钉的话某天 aifix 发个新版，这条流水线的行为会在没人改过
          # 任何东西的情况下变掉 —— 而它是会花钱、会开 PR 的。
          /tmp/aifix-venv/bin/pip install --quiet "aifix-code==0.4.1"
          /tmp/aifix-venv/bin/aifix --help > /dev/null && echo "aifix 就绪"

      - name: aifix issue handle
        run: /tmp/aifix-venv/bin/aifix issue handle
        env:
          # gh CLI 与 git push 都用它
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ★ 与 ci.yml 同一条理由，且必须一致：显式置空，需要真实端点的测试据此整文件
          #   skip（tests/test_integration_real.py:17）。aifix 的 baseline 就是判卷标准，
          #   它必须和 CI 判的是同一个东西 —— 否则「本来就红的」那个集合对不上，
          #   「这个补丁没弄坏别的」这个结论跟着失效。
          #   附带的一层：任何漏网的真实调用会直接 401 而不是烧钱。
          HARNESS_API_KEY: ""

          # 两条模型路由都从仓库 variable 读，缺省退回 flash：
          #   gh variable set AIFIX_FIXER__MODEL    --body deepseek-v4-pro
          #   gh variable set AIFIX_DETECTOR__MODEL --body deepseek-v4-flash
          #
          # variable 名与环境变量**同名**：设什么就是什么，不用记一层映射。换模型因此
          # 不必改这个文件 —— 而改它要合进默认分支才生效，一次换模型要走一次提交、
          # 评审、合并，那个摩擦足以让人干脆不换。
          #
          # 缺省是 flash 而不是 pro：这个默认值只在「还没配就先跑一次」时生效，那种时候
          # 要验的是链路通不通，不是修复质量 —— 拿贵的模型验管道，贵在了不产生信息的
          # 地方。
          AIFIX_FIXER__MODEL:       ${{ vars.AIFIX_FIXER__MODEL || 'deepseek-v4-pro' }}
          # 端点用 variable 不用 secret：它不是机密，而 secret 在日志里会被遮成
          # ***，配错了端点你从日志里根本看不出来 —— 与价格表同一条理由。
          AIFIX_FIXER__BASE_URL:    ${{ vars.AIFIX_BASE_URL }}
          AIFIX_FIXER__API_KEY:     ${{ secrets.AIFIX_API_KEY }}
          AIFIX_DETECTOR__MODEL:    ${{ vars.AIFIX_DETECTOR__MODEL || 'qwen3-coder-flash' }}
          AIFIX_DETECTOR__BASE_URL: ${{ vars.AIFIX_BASE_URL }}
          AIFIX_DETECTOR__API_KEY:  ${{ secrets.AIFIX_API_KEY }}

          # 第三条路由：裁判模型（aifix 0.3.0 起）。交付前让它复审一遍补丁，
          # **只出信号，不改判定、不挡交付** —— 判 verdict 的仍然是零 LLM 的
          # 三态比较。它补的是前面几层抓不到的那部分：语义上「改的位置不对，
          # 但恰好让测试过了」。
          #
          # 必须和 fixer 是**不同的模型**。写补丁的和验补丁的是同一个脑子时，
          # 两边的盲区、被 prompt 说服的方式全都一样，那等于没验。当前分工：
          # detector=qwen3-coder-flash、fixer=deepseek-v4-pro、
          # reviewer=qwen3-coder-plus（三个各不相同，实际取值在 gh variable 里）。
          #
          # 打开了却没配这条路由的话 aifix **拒绝启动**，不会悄悄退回 fixer ——
          # 所以下面三行一条都不能少。
          AIFIX_REVIEWER_CHECK:     ${{ vars.AIFIX_REVIEWER_CHECK || 'true' }}
          AIFIX_REVIEWER__MODEL:    ${{ vars.AIFIX_REVIEWER__MODEL || 'qwen3-coder-plus' }}
          AIFIX_REVIEWER__BASE_URL: ${{ vars.AIFIX_BASE_URL }}
          AIFIX_REVIEWER__API_KEY:  ${{ secrets.AIFIX_API_KEY }}

          # 价格表用 variable 不用 secret：它不是机密，而放进 secret 会在日志里被遮成
          # ***，你反而看不出它配没配对 —— 而没配价格表的后果是**美元闸永远不触发**
          # （成本恒算成 0）。格式是 {模型名: [输入价/千token, 输出价/千token]}。
          AIFIX_PRICE_MAP: ${{ vars.AIFIX_PRICE_MAP }}
          # 价表按哪种货币填。**显式写死**：aifix 0.3.0 起结算一律人民币，价表
          # 仍可按美元填（这是默认），由它按 AIFIX_USD_TO_CNY（默认 7.2）折算。
          #
          # 写出来是因为这个假设现在是承重的：同一张表按两种货币读差 7.2 倍，
          # 而两个数看起来都很正常。这里写 USD 是**沿用改动前的实际行为**
          # （此前没设这一项，走的就是默认的 USD）—— 不是核对过价目表得出的
          # 结论。表里那四个既有条目到底按哪种货币填的，只有填它的人知道；
          # 若其实是人民币，那么它们从一开始就在被乘 7.2，与本次改动无关。
          AIFIX_PRICE_CURRENCY: USD

          # 额外获准触发 aifix 的登录名，逗号分隔（可选）。
          #   gh variable set AIFIX_ALLOWED_USERS --body "alice,bob"
          # 它是**加法**：默认已经放行仓库所有者、有写入权限的协作者、以及组织仓库的
          # 成员。这份名单用来点名放进按 author_association 认不出来的人。
          AIFIX_ALLOWED_USERS: ${{ vars.AIFIX_ALLOWED_USERS }}

          # ★ 显式配，别靠探测：runner 上 clone 出来没有 .venv，自动探测落空会退回
          #   aifix 自己的解释器，而本项目的测试依赖不在那里面 —— 表现是一整批
          #   collection error 被当成待修的 bug 排进队列，真花钱，而报告最后写的是
          #   「模型没修好」，一个成绩，其实是一次故障。
          #   uv sync 就把 venv 建在这里。
          AIFIX_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python

          # 两套测试都跑：后端 pytest + 前端 vitest（前端在 web/ 下，aifix 自己探）。
          #
          # **顺序有意义**，不只是列个清单：复现那一步只能挑一套（一条复现测试
          # 只能是一种语言），而 aifix 按这里的顺序挑第一个 —— 写在前面的是
          # pytest，因为本仓库的缺陷报告绝大多数是后端的。反过来写的话，每一条
          # 后端 issue 都会拿到一条 .ts 复现测试，而红检只会说「这条测试没红」。
          #
          # 不设这一项的话只跑探测到的第一个，另一套的用例**一条都不执行** ——
          # 那不是「通过」，是不存在：baseline 看不见它们，三态判定也就永远不会
          # 因为它们变红而判 WORSE。改后端悄悄弄坏前端，报告里看不出来。
          AIFIX_ADAPTERS: pytest,vitest

          # 复现那一步的思考模式，默认关（与 aifix config 的默认一致）。
          #   gh variable set AIFIX_REPRODUCER_THINKING --body true   # 开回去
          #
          # `|| 'false'` 不能省：variable 未设置时 Actions 给的是**空串**，而空串被 aifix
          # 的 before-validator 当作「不发这个参数」= 随端点默认 = 开。那与「默认关」
          # 正好相反 —— 一个纯粹由 YAML 语义造成的、和意图反着来的默认值。
          AIFIX_REPRODUCER_THINKING: ${{ vars.AIFIX_REPRODUCER_THINKING || 'false' }}

          # fixer 的思考模式（aifix 0.4.0 起）：**默认关，验证不通过之后升级成开**。
          #
          # 关是因为修 bug 的活大多是机械的（读代码、改几行、跑测试），而推理按
          # 输出 token 计费 —— 实测复现那一步有一轮的输出预算被推理全部吃掉、
          # 正文一个字没吐。第 1 轮先便宜地试一次。
          #
          # 第 2 轮起自动开：attempt 只在 verify 判了 not-better 之后才递增，
          # 所以 attempt≥2 精确地就是「上一轮写出来的代码没通过验证」。守卫重试
          # （空 diff）不递增 attempt，也就不触发升级 —— 那是「没写出代码」，
          # 要的补救是把话说清楚，不是更强的推理。
          #
          # fixer 现在是 deepseek-v4-pro，harness 会把 enable_thinking 翻成
          # DeepSeek 口径的 thinking={"type": "enabled"/"disabled"}。
          #
          # `|| 'false'` 不能省，理由与上面那条一样：variable 未设置时 Actions
          # 给的是空串，而空串被当作「不发这个参数」= 随端点默认 = 可能是开。
          AIFIX_FIXER_THINKING: ${{ vars.AIFIX_FIXER_THINKING || 'false' }}
          AIFIX_FIXER_THINKING_AFTER_ATTEMPT: ${{ vars.AIFIX_FIXER_THINKING_AFTER_ATTEMPT || '2' }}

          # 预算三闸。语义是「越线之后不再发起新的模型调用」，不是「绝不超过这个数」
          # —— 超支上界是一次模型调用。别设太紧：实测把上限从 $0.60 调到 $0.20 时，
          # 某个任务 1 轮就被掐断判成「没修好」，放回去之后同一个任务修好了。
          # 预算设太紧会把「模型不行」和「额度不够」混成同一个数字。
          # aifix 0.3.0 起上限按**人民币**。默认值 14.4 = 旧的 $2.0 × 7.2，
          # 也就是与改名之前**等价**的额度 —— 直接把 2.0 抄过来会是一次静默的
          # 7 倍缩水，表现是「模型最近怎么老是没修完就说预算耗尽」。
          AIFIX_BUDGET_CNY: ${{ vars.AIFIX_BUDGET_CNY || '14.4' }}
          AIFIX_BUDGET_WALL_SECONDS: "3600"

      # 崩了才最需要它。`if: always()` 不是可选的 —— job 失败时不上传，等于恰好在最需要
      # 诊断数据的那一次把它扔了。下载解压后 `aifix replay <run_id> --repo <目录>` 能看到
      # 模型每一步读了什么、改了什么、为什么被守卫拦下。
      #
      # 版本按本仓库 9481e4d 定下的口径选：「各自第一个采用 node24 的大版本」。
      # upload-artifact 的 v5 只是**预备**支持 node24、默认仍跑 node20，v6 才是默认
      # node24 的那一版（v7 另加了 direct upload / ESM，我们用不到）。
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: aifix-trace-${{ github.event.issue.number }}-${{ github.run_id }}
          path: .aifix/runs/
          retention-days: 30
