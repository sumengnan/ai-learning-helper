name: Deploy to server

# main 有变动即部署；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署在跑，避免并发互相打架
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/ai-learning-helper
  IMAGE: sumengnan/ai-learning-helper

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本戳
        id: meta
        run: |
          # 短 sha 既作镜像 tag，也经 build-arg 烙进前端 bundle 与后端环境变量（版本自检用）
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          build-args: |
            APP_GIT_SHA=${{ steps.meta.outputs.sha }}
            APP_BUILD_TIME=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 安装 sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 上传 compose 文件到服务器
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh -p ${{ secrets.SERVER_PORT }} $SSH_OPTS \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "mkdir -p ${{ env.DEPLOY_DIR }}"
          sshpass -e scp -P ${{ secrets.SERVER_PORT }} $SSH_OPTS \
            docker-compose.yml "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.yml"

      - name: 服务器拉取并启动
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # 镜像公开，服务器免登录直接 pull。--no-build 保证服务器绝不构建（没有源码）。
          sshpass -e ssh -p ${{ secrets.SERVER_PORT }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "set -e; cd ${{ env.DEPLOY_DIR }}; \
             test -f .env || { echo '缺少 .env，请先在服务器 ${{ env.DEPLOY_DIR }}/.env 放好密钥'; exit 1; }; \
             export APP_IMAGE_TAG='${{ steps.meta.outputs.sha }}'; \
             docker compose up -d --pull always --no-build; \
             docker image prune -f; \
             docker compose ps"
