services:
  app:
    # 部署：服务器 docker compose pull 拉 Docker Hub 上 CI 推的镜像（APP_IMAGE_TAG=<sha>，
    # 缺省 latest）。build 段仅供本地 `docker compose build` 使用；服务器用 --no-build 不触发。
    image: sumengnan/ai-learning-helper:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        # 版本戳：本地 build 时用环境变量注入（APP_GIT_SHA=<short sha>、APP_BUILD_TIME=<UTC>）；
        # 缺省回退 dev。CI 构建时由 build-push-action 传入。
        APP_GIT_SHA: ${APP_GIT_SHA:-dev}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    container_name: ai-learning-helper
    restart: unless-stopped
    # 机密与模型配置从服务器上的 .env 读取（含 HARNESS_API_KEY / AUTH_SECRET 等）
    env_file:
      - .env
    environment:
      # 容器内对外监听
      HARNESS_APP_HOST: "0.0.0.0"
      HARNESS_APP_PORT: "8000"
      # 全部持久化数据落到挂载卷 /app/data，重建容器不丢
      HARNESS_APP_DB_PATH: /app/data/app.db
      HARNESS_PERSISTENCE_DB_PATH: /app/data/harness.db
      HARNESS_MEMORY_DB_PATH: /app/data/memory.db
      HARNESS_DOWNLOADS_DIR: /app/data/downloads
      HARNESS_ATTACHMENTS_DIR: /app/data/attachments
    ports:
      # 宿主 8000 -> 容器 8000；如需 80 端口改成 "80:8000"
      - "8000:8000"
    volumes:
      # 持久化数据（SQLite 库 + 下载/附件产物）
      - ./data:/app/data
      # 应用会调用宿主 Docker 起代码/浏览器子沙箱（启用 HARNESS_ENABLE_SANDBOX/BROWSER 时）
      - /var/run/docker.sock:/var/run/docker.sock
